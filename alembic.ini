# Alembic configuration.
#
# The migration environment lives under database/, not backend/, because the approved
# architecture keeps "the database as a database" separate from the application that
# queries it. The URL is deliberately absent: env.py reads it from the environment via
# app.core.config, so a connection string is never committed.

[alembic]
script_location = database/migrations
prepend_sys_path = backend
path_separator = os
# UTC timestamps in revision filenames keep the history readable and sortable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
