# AI Hotel Intelligence Platform -- local stack.
#
# VERIFIED AT RUNTIME, in CI rather than here: Docker is still not installed on the development
# machine, so every change to this file is proved by the `docker-runtime` job in
# .github/workflows/ci.yml, which builds both images and runs this stack on every push. It
# asserts the startup chain below, PostgreSQL 18.6, the schema reaching 0009, the SPA fallback,
# the /api proxy, TLS and the trusted-proxy boundary, secret isolation, migration idempotency,
# persistence across a restart, that the running nginx keeps proxying to a REPLACED api
# container without being restarted itself, and that a failed migration keeps the API from
# starting.
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD, and SECRET_KEY for production
#   docker compose up --build
#
# ## Startup is a chain of conditions, not a sequence of hopes
#
#   db  --healthy (pg_isready)-->  migrate  --exited 0-->  api  --healthy (/health)-->  frontend
#
# The `migrate` link is the reason the chain exists. Nothing in this system can otherwise tell
# a migrated database from an empty one: `pg_isready` answers for the server, not the schema,
# and the API's own readiness probe is `SELECT 1`, which succeeds perfectly well against a
# database with no tables in it. Without the gate, a stack on a fresh volume comes up with
# every probe green and every data endpoint returning 500.
#
# `service_completed_successfully` is what makes it a gate rather than a suggestion: the API
# is not started at all unless Alembic exited 0.

# Both backend services read the same configuration, and it is important that it is literally
# the same: `migrate` must upgrade the database that `api` then queries. Anchored rather than
# written twice so the two cannot drift -- a DATABASE_URL that diverged here would migrate one
# database and serve another, and nothing downstream would notice.
#
# `migrate` needs more than the URL, which is not obvious. database/migrations/env.py does
# `from app.core.config import Settings` and constructs it, so every validator in Settings runs
# before a single revision is applied: a production environment with no SECRET_KEY, or a
# malformed TRUSTED_PROXIES entry, fails the migration rather than failing later in the API.
# That is the right order to find out.
x-backend-environment: &backend-environment
  # Inside the compose network the database is reachable by service name.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hotel_intelligence}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

  # Passed through with an empty default, and deliberately not with a `:?` guard.
  #
  # The application already decides this correctly: app/core/config.py refuses to construct a
  # production configuration without a secret and will not fall back to a built-in one, while
  # development starts without it. A `:?` here would override that judgement from the outside
  # and make the secret mandatory in development too. Empty in, application decides -- so
  # production still fails closed, and it fails with the application's own message.
  SECRET_KEY: ${SECRET_KEY:-}

  # The single address nginx connects from -- a /32, not a subnet, and not empty.
  #
  # Empty means "read no forwarding header at all". That is the safe default for a directly
  # exposed API and the WRONG value here: nginx sits in front, so with it empty the backend
  # ignores X-Forwarded-For (app/core/client_address.py, rule 2) and attributes every request to
  # the proxy. The per-address login limit then becomes one bucket for the whole deployment --
  # five sign-ins a minute for everybody -- audit records name nginx rather than the client, and
  # X-Forwarded-Proto is ignored too, so HSTS can never activate.
  #
  # Too broad is worse than empty: anything inside a trusted range can claim to be any client.
  # This is why the network below declares its subnet and the frontend gets a fixed address --
  # the boundary is exactly one container, stated in this file, rather than whatever subnet
  # Docker happened to allocate. Change this, FRONTEND_IP and COMPOSE_SUBNET together.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.29.0.10/32}

  # Matching the header nginx sets on the static responses, so one origin does not advertise two
  # different policies depending on which path answered. `includeSubDomains` is off because this
  # deployment makes no claim about subdomains it does not serve -- turning it on would impose
  # HTTPS on every neighbouring name under the same domain. Preload stays off in the application
  # by default and is not enabled here; it is close to irreversible.
  HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}

# ## No `container_name` anywhere below, and that is deliberate
#
# Compose names containers `<project>-<service>-<index>` and scopes that name to the PROJECT.
# `container_name` overrides it with a name scoped to the DAEMON instead, which is not the
# cosmetic difference it looks like: a second copy of this stack -- staging beside production, a
# reviewer's checkout beside a running one, or CI's own disposable failure-gate project -- is
# refused with "the container name /hotel_db is already in use" even though its network, its
# volume and its project are entirely separate. Run 35097766182 failed exactly that way, and CI
# carried a block of `container_name: *_failgate` overrides for no other reason.
#
# Nothing here needed the fixed names. Services find each other by SERVICE name over this
# network's DNS -- `db`, `api`, which is what DATABASE_URL and frontend/nginx.conf use -- and
# that is unaffected by how the containers are named. `docker compose exec <service> ...`
# addresses them without one, and every assertion in CI selects by Compose label rather than by
# name.
services:
  db:
    # Pinned to 18.6 to match what this project actually verifies: CI runs postgres:18.6 and
    # the development machine runs 18.6, so the schema, the 9-revision chain and all 4000
    # backend tests are exercised against that version and no other. The previous
    # `postgres:16-alpine` ran a major version nothing here has ever executed.
    #
    # Exact, not `postgres:18-alpine`: a floating major tag silently moves the server under a
    # data directory that is bound to its major version.
    #
    # And pinned by DIGEST as of Stage 5.38, because `18.6-alpine` is exact about PostgreSQL and
    # silent about everything else: the tag is rebuilt whenever Alpine or a linked library is
    # patched, so it is a different filesystem from one month to the next. For the one service
    # that owns persistent state, "which build of 18.6" is worth recording. The digest was read
    # from the registry rather than invented, and the image's own config blob, fetched back BY
    # that digest, reports PG_VERSION=18.6. The tag beside it is documentation; resolution uses
    # the digest. docs/deployment/reproducibility.md records how to re-resolve it.
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_intelligence}
    # No `ports:`. The database is reachable at db:5432 from inside the compose network, which
    # is the only place anything needs it: the API connects over that network and nothing on
    # the host does. Publishing it put the stack's one real secret in front of every process on
    # the machine and, on a developer box already running PostgreSQL, collided with it.
    volumes:
      # `/var/lib/postgresql`, NOT `/var/lib/postgresql/data`.
      #
      # PostgreSQL 18 changed where the official image keeps its cluster: data now lives in a
      # major-version subdirectory (`/var/lib/postgresql/18/docker`) so that `pg_upgrade --link`
      # can work across versions without crossing a mount boundary. The mount therefore belongs
      # at the PARENT. Given the old 16-era path the image sees a volume it would never write
      # to, recognises that the data would silently not persist, and refuses to start -- which
      # with `restart: unless-stopped` becomes a crash loop, not a clear error.
      #
      # Found by running it: CI run 34984757640 reported `db did not become healthy within
      # 120s` with "there appears to be PostgreSQL data in: /var/lib/postgresql/data (unused
      # mount/volume)". No amount of static checking could have caught this -- the path is
      # valid YAML, a valid volume and a valid mount; only the 18 image knows it is wrong.
      - postgres_data:/var/lib/postgresql
      # Anything dropped in database/init/ is executed once, on first cluster creation.
      # Currently empty: the schema arrives through Alembic, in the `migrate` service below.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    # The same build and the same image tag as `api`, so the two cannot be different code.
    # Compose builds it once and the second service reuses the tag.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hotel-intelligence-api:local
    # One shot, and no restart policy on purpose. `unless-stopped` here would turn a failed
    # migration into an unbounded retry loop issuing DDL against a live database -- a far worse
    # failure than simply not starting. It runs, it exits, and its exit code is the signal.
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-environment
    # `python -m alembic`, not the bare console script: `-m` puts the working directory on
    # sys.path as sys.path[0], which is how env.py's `from app.core.config import Settings`
    # resolves inside the image. It is also exactly the invocation CI uses, so the command that
    # migrates a deployment is the command the migration chain is verified with.
    #
    # No retry wrapper, no shell loop, no `|| true`. Waiting for the database is already
    # handled by `service_healthy` above, so the only thing left that can fail here is a real
    # migration failure -- and that must stop the stack, not be swallowed and retried.
    #
    # `upgrade head` is idempotent: against a database already at 0009 it applies nothing and
    # exits 0. There is no downgrade here and there must not be; see .env.example.
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hotel-intelligence-api:local
    restart: unless-stopped
    # Only on migrate, not on db. `migrate` already waits for `db` to be healthy, so the
    # ordering is transitive, and naming db here as well would suggest the API has a route to
    # start that skips the migration. It does not, and that is the point of the stage.
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    # NO `ports:`. The API is reachable at api:8000 from inside the compose network and from
    # nowhere else; nginx is the only way in.
    #
    # It was published up to Stage 5.35 because a first bring-up gets debugged through it. That
    # justification expired once the deployment terminated TLS: a published 8000 is a second,
    # plaintext entrance that bypasses every header, the redirect and the certificate, and with
    # ENVIRONMENT unset it also serves /docs. Reaching the API directly is now a deliberate act
    # -- `docker compose exec api ...` -- rather than something the topology offers by default.
    # /health is the liveness probe and consults no dependency (app/api/routes/health.py): no
    # authentication, no database, no data endpoint. /health/db is deliberately NOT used -- a
    # database blip would then mark the API unhealthy and take the frontend down with it, when
    # the API is running correctly and already answers 503 for that case by itself.
    #
    # Run with the interpreter that is already in the image. python:3.12-slim ships no curl and
    # no wget, and installing one for a health probe would add packages to the runtime image
    # for no other reason; urllib is in the standard library. urlopen raises on any non-2xx, so
    # an unhandled exception is itself the failure signal.
    #
    # 127.0.0.1, not localhost: uvicorn binds 0.0.0.0, which is IPv4 only, so a localhost that
    # resolved to ::1 would fail against a perfectly healthy process.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty is correct for this topology and is not an oversight: the browser then calls
        # /api/v1/... on its own origin, nginx proxies it to api:8000, no CORS is involved and
        # the bundle's `connect-src 'self'` CSP is satisfied.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    # service_healthy, not the short form, and the reason changed in Stage 5.37 without the
    # condition changing. It used to be about name resolution: nginx resolved `api` once, at
    # startup, so starting the frontend early was exactly when that could fail. It no longer
    # resolves once -- frontend/nginx.conf reaches the API through a variable and re-resolves per
    # request -- so the frontend would now survive starting first.
    #
    # It still waits, because "would survive" is not "should". The short form returns as soon as
    # the api CONTAINER starts, which is before uvicorn is listening: the frontend would come up
    # advertising a site whose every /api request 502s, and a browser would be told the
    # application is available before any of it is. Waiting for health costs a few seconds once.
    depends_on:
      api:
        condition: service_healthy
    # A fixed address inside the declared subnet below, so the backend's trust boundary can name
    # this container exactly rather than a whole network. See TRUSTED_PROXIES above.
    networks:
      default:
        ipv4_address: ${FRONTEND_IP:-172.29.0.10}
    ports:
      # Both, and both are needed: 80 exists only to redirect to 443 (see frontend/nginx.conf),
      # because a client that types the hostname without a scheme arrives on 80 and must be sent
      # somewhere rather than refused.
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # The certificate and key, read-only, mounted rather than built in -- so the image is the
      # same everywhere, a private key never enters a layer or a registry, and renewal is a file
      # replacement plus a reload rather than a rebuild. See docs/deployment/tls.md.
      #
      # If this directory does not contain fullchain.pem and privkey.pem, nginx refuses to
      # start. That is deliberate: a server that cannot present a certificate should not fall
      # back to serving the application unencrypted.
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    # /healthz on port 80, and the reason is TLS rather than laziness.
    #
    # This probe runs INSIDE the container, where the only HTTP client is BusyBox's wget, which
    # has no usable way to trust this deployment's certificate -- so an HTTPS probe would fail
    # on certificate verification rather than on nginx's health, and disabling verification
    # would make the probe pass against a server whose TLS was broken. /healthz is the one path
    # port 80 does not redirect; it returns a constant and discloses nothing.
    #
    # It proves nginx is up and serving. It does NOT prove the SPA is present or that TLS works
    # -- both of those are asserted over real HTTPS, with the CA certificate, by the
    # docker-runtime job in .github/workflows/ci.yml, which has curl.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

# An explicitly declared network, which exists so the trust boundary can be a constant.
#
# Compose allocates a subnet from Docker's default pool when none is declared, and it is not
# guaranteed to be the same one after a `down`. TRUSTED_PROXIES would then either have to be
# rediscovered on every deployment or -- far worse -- be set once to a subnet that later
# belongs to something else, silently trusting the wrong network. Declaring the subnet here,
# and pinning the frontend to a fixed address inside it, makes the boundary a fact of this
# file rather than of whatever Docker happened to hand out.
#
# 172.29.0.0/16 sits inside Docker's usual default pool. Both it and the frontend's address are
# overridable, for two reasons: a host that already uses this range needs somewhere else to go,
# and a second copy of this stack on one host cannot claim the same pool -- Docker refuses with
# "Pool overlaps with other one on this address space". CI relies on that override to run its
# disposable failure-gate stack beside the real one.
#
# Change COMPOSE_SUBNET and you must change FRONTEND_IP and TRUSTED_PROXIES with it. They are
# one decision written in three places.
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.29.0.0/16}
