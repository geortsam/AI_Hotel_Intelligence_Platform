# Production serving for the built SPA, and the one route that is not the SPA.
#
# This file REPLACES the stock `default.conf` in the nginx image (see the Dockerfile), so the
# server block below is the only one active. Stock nginx serves this directory with no
# fallback, no cache policy and no security headers, which is why each section here exists.
#
# ## A note on `add_header`, because it is the trap in this file
#
# nginx does NOT merge `add_header` down into a location that declares its own. A location
# that sets `Cache-Control` therefore LOSES every header inherited from the server block. The
# security headers are consequently repeated in each location rather than written once at the
# top -- duplication that looks redundant and is not. `always` makes them apply to error
# responses too, not only to 2xx.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The bundle is fully hashed and public; there is nothing to gain from advertising the
    # server's exact version to every client.
    server_tokens off;

    # --- compression ---------------------------------------------------------------------
    #
    # Stock nginx ships with gzip off, so without this the server transmits the bundle
    # uncompressed: ~784 kB of assets on the wire instead of ~236 kB. Every gzip figure this
    # project has reported was a property of the BUILD ARTEFACT; this is what makes it a
    # property of the response.
    #
    # `gzip_vary on` is not decoration. It adds `Vary: Accept-Encoding`, without which a shared
    # cache can hand a gzipped body to a client that never asked for one -- and this server
    # marks /assets/ `immutable`, so a wrong entry would be kept for a year rather than
    # corrected on the next request. A client that does not advertise gzip still receives the
    # identity encoding; nginx decides per request.
    #
    # Level 6 is nginx's default and the right point on the curve here: level 9 takes the
    # entry chunk from 99,757 to 98,881 bytes -- 0.9% -- for materially more CPU per response.
    #
    # 1024 bytes as the floor because below it compression stops paying: the framing overhead
    # is a meaningful fraction of a small body, and gzip can even enlarge one. That does mean
    # this build's 415-byte index.html is sent uncompressed -- 133 bytes unsaved, inside a
    # single packet either way. Lower the floor if you would rather have those bytes.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;

    # `text/html` is deliberately ABSENT: nginx always compresses it when gzip is on, and
    # naming it here produces a "duplicate MIME type" warning at startup. The rest are listed
    # explicitly. `.js` appears twice because nginx's own mime.types has mapped it to both
    # `application/javascript` and, in later versions, `text/javascript`; covering both means
    # this file does not depend on which mapping the base image happens to carry.
    #
    # Today's build emits only .js, .css and .html -- 28, 18 and 1 files, checked against
    # dist/. JSON, SVG and XML are here because they are the text types a frontend acquires
    # next, not because something already needs them. Images, fonts and archives are
    # deliberately not listed: they arrive compressed, and gzipping them again spends CPU to
    # add bytes.
    gzip_types text/css
               text/javascript
               application/javascript
               application/json
               application/manifest+json
               image/svg+xml
               text/xml
               application/xml;

    # `gzip_proxied` is left at nginx's default (`off`), which means responses from the /api
    # proxy below are NOT compressed. That is the stock behaviour rather than a rule invented
    # here, and it keeps this stage's change confined to static serving: the API's responses
    # go out exactly as they do today. Compressing them is the backend's decision to make.

    # --- the API, first ------------------------------------------------------------------
    #
    # Declared before the SPA fallback because the order of evaluation is the whole point: a
    # request the API answers with 404 must come back as the API's 404, not as index.html
    # with status 200. This prefix location wins over the `/` fallback for `/api/...`, so the
    # fallback never sees these requests.
    #
    # `proxy_pass http://api:8000;` carries NO URI part, and that is what preserves the path:
    # nginx forwards the original `/api/v1/...` unchanged. Writing `http://api:8000/` instead
    # would strip the `/api/` prefix, and every request would then miss the backend's own
    # API_V1_PREFIX (/api/v1). That single trailing slash is the difference between a working
    # deployment and a uniformly 404ing one.
    #
    # `api` is the service name in docker-compose.yml. nginx resolves it once at startup, so
    # the api container must exist before this one starts -- which compose's `depends_on`
    # already arranges.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;

        # The backend derives the client address and the scheme from these (see
        # app/core/client_address.py). Rate limiting and audit records depend on seeing the
        # real client rather than this proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        # No headers are added here on purpose. The API sets its own on its own responses,
        # and a static-file policy copied onto an API response would be the wrong policy.
    }

    # --- hashed assets -------------------------------------------------------------------
    #
    # Every file Vite emits under /assets/ carries a content hash in its name, so a change to
    # the content is a change to the URL. A cached copy can therefore never be stale, which is
    # exactly the condition `immutable` describes: do not even revalidate, the answer cannot
    # have changed. A year is the conventional ceiling.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "DENY"        always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

        # A request for a hashed file that does not exist is a genuine 404. It must NOT fall
        # through to index.html: answering a missing script with HTML produces a module-parse
        # error in the browser instead of a clear, findable failure.
        try_files $uri =404;
    }

    # --- the HTML ------------------------------------------------------------------------
    #
    # index.html is the ONLY unhashed file, and it is the index of every hash. A browser that
    # keeps a stale copy keeps pointing at deleted assets and never learns that a deployment
    # happened, so it may store this file but must revalidate it every time. `no-cache` means
    # exactly that -- store, then revalidate -- and with the ETag nginx already sends, the
    # usual answer is a 304 carrying no body. It is never `immutable`.
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "DENY"        always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

        # Derived from THIS bundle rather than copied from a template:
        #
        #   script-src 'self'           the built index.html carries no inline <script>, and
        #                               the bundle contains no eval and no new Function --
        #                               checked against dist/ -- so neither relaxation is
        #                               needed and neither is granted.
        #   style-src  'unsafe-inline'  IS needed, and only for style ATTRIBUTES: Skeleton.tsx
        #                               and ReviewSummary.tsx set `style={{ ... }}`, which
        #                               style-src governs. Removing this means moving those two
        #                               to CSS custom properties first. It is not a switch to
        #                               flip hopefully.
        #   connect-src 'self'          the frontend calls /api on its own origin through the
        #                               proxy above. A deployment that instead points
        #                               VITE_API_BASE_URL at a different origin MUST add that
        #                               origin here, or the browser will block every request.
        #   img-src ... data:           inline SVG data URIs are an ordinary icon pattern.
        #   default-src 'none'          anything not named above is refused rather than
        #                               inherited from a permissive default.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # --- the SPA fallback ----------------------------------------------------------------
    #
    # The application uses createBrowserRouter, so /bookings, /reviews and the rest are real
    # URLs that exist only inside the browser. Without this, nginx answers a refresh or a
    # pasted link with its own 404 and the application never loads at all. The internal
    # redirect to /index.html re-enters the exact-match location above, so the HTML policy
    # applies there rather than being restated here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
