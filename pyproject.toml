# Single source of tooling truth for the repository.
#
# Tests live at the repository root (tests/) while the application lives in backend/, so
# pytest needs backend/ on sys.path -- that is what `pythonpath` below does. Keeping ruff,
# mypy, pytest and coverage configured in one root file means every command runs from the
# repository root with no directory juggling.

[project]
name = "ai-hotel-intelligence-platform"
version = "0.1.0"
description = "AI-powered hotel management and analytics platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The application package lives in backend/, not at the repository root, so ruff must be told
# where first-party code starts -- otherwise `app` is sorted as a third-party import. This is
# the same layout fact that `pythonpath = ["backend"]` gives pytest above.
src = ["backend", "."]
# The initial migration embeds DDL rendered by SQLAlchemy verbatim, so that the
# migration and the models provably agree. Its formatting is the compiler's, not
# ours, and reformatting it would break that guarantee.
extend-exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI dependencies are function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "backend"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# scikit-learn and SciPy ship no py.typed marker and no stubs are published for either, so
# every import of them is an `import-untyped` error by default. The alternative is a
# `# type: ignore` on each import, which `warn_unused_ignores` would then have to police.
# The override is scoped to those two packages: nothing else in the tree is exempted, and
# NumPy is deliberately absent from the list because it ships its own types.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

# Stage 7.5: the language-model provider SDK is an OPTIONAL dependency, declared in
# backend/requirements-llm.txt and installed by neither CI nor the image. So it is genuinely
# absent when mypy runs, and `app/llm/providers/anthropic_provider.py` -- the one module allowed
# to name it, behind a deferred import -- would be an `import-not-found` error on every run.
#
# This is a different reason from the sklearn entry above, which is about missing type stubs for
# an installed package. Here the package is not installed at all, and that is the design: the
# base application must remain installable and runnable without a vendor SDK. Pinning the
# dependency just to satisfy the type checker would undo the isolation the stage exists to
# establish.
#
# Scoped to the one package, like the entry above. The adapter itself is fully typed; only the
# vendor's own module is exempt.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true
