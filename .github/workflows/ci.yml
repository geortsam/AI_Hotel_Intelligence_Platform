# Continuous integration: the quality gates that guard a local stage, run on a clean
# machine. The backend's run against a disposable PostgreSQL; the frontend's run against
# nothing at all.
#
# The two are separate jobs on purpose. They share no state -- the frontend suite is
# jsdom-only and stubs HTTP at the `fetch` boundary -- so making one wait on the other
# would add the backend's minutes to the frontend's feedback time and hide a frontend
# failure behind a backend one. Run in parallel, one red run names every gate that is red.
#
# Every command below is taken from the repository rather than chosen here:
#
#   dependencies   backend/requirements-dev.txt, which itself pulls in requirements.txt.
#                  pyproject.toml declares no `dependencies` and no build-system, so the
#                  project is NOT pip-installable -- there is nothing to `pip install -e`.
#   ruff / mypy    configured in the root pyproject.toml; both are run from the root.
#   pytest         `testpaths = ["tests"]` and `pythonpath = ["backend"]` come from the same
#                  file, which is why no PYTHONPATH is set here.
#   alembic        `prepend_sys_path = backend` in alembic.ini does the same job for the
#                  migration environment, and database/migrations/env.py resolves the URL
#                  from TEST_DATABASE_URL. No URL is stored in alembic.ini.
#   npm            the `test`, `typecheck` and `build` scripts in frontend/package.json,
#                  run unmodified. None is given a path, a filter or a flag that would
#                  narrow what it covers.
#
# ml/requirements-ml.txt is deliberately NOT installed: app/ml/timeseries.py is standard
# library only (datetime, decimal, statistics, enum, typing), so the suite does not need
# pandas, numpy or scikit-learn and CI stays fast.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    env:
      # The database name MUST end in `_test`: tests/integration/conftest.py refuses to run
      # otherwise, because the suite issues `alembic downgrade base` and TRUNCATE ... CASCADE.
      # That guard is the reason this name is not arbitrary.
      POSTGRES_DB: hotel_intelligence_test
      POSTGRES_USER: postgres
      # Not a secret. It authenticates to a container that is created for this job and
      # destroyed with it, is reachable only from this job's network namespace, and holds
      # nothing but tables the suite creates and drops. No application credential, and no
      # credential of any real environment, appears anywhere in this repository.
      POSTGRES_PASSWORD: ci-ephemeral-postgres-password

    services:
      # The three values below repeat the job-level `env` on purpose. GitHub does not expose
      # the `env` context inside `jobs.<id>.services.*`, so `${{ env.POSTGRES_DB }}` would
      # expand to an empty string here. Do not "de-duplicate" this block.
      postgres:
        # Pinned to the version the schema was developed and verified against. The exclusion
        # constraint needs btree_gist, which the official image ships as a contrib module.
        image: postgres:18.6
        env:
          POSTGRES_DB: hotel_intelligence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The version this project is developed on. pyproject declares >=3.12 as the floor;
          # CI runs what the developer runs, so a 3.14-only failure cannot hide behind an
          # older interpreter.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt begins with `-r requirements.txt`, so this single file
        # installs the runtime and the tooling together.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: mypy
        run: python -m mypy .

      - name: Verify the migration chain
        # `upgrade head` against an empty database runs all nine migrations for real. It is
        # not `stamp`: nothing here writes alembic_version without executing the revisions.
        #
        # `expected` below is pinned rather than read back from `alembic heads`: a derived
        # value would agree with itself whatever the chain did, including growing a second
        # head, which is the one thing this step exists to catch. The cost is that adding a
        # migration is a two-file change -- and this line going stale when 0007-0009 landed
        # is what made this step fail until Stage 5.18.
        #
        # The downgrade path is covered too, but by the suite rather than here --
        # tests/integration/conftest.py's session-scoped engine fixture runs
        # `downgrade base` followed by `upgrade head` before the first integration test.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: |
          set -euo pipefail
          expected='0009_audit_booking_deleted'

          echo "--- declared head ---"
          heads="$(python -m alembic heads 2>&1)"
          echo "$heads"
          echo "$heads" | grep -q "^${expected} (head)$" \
            || { echo "::error::expected head ${expected}, got: ${heads}"; exit 1; }

          echo "--- applying migrations ---"
          python -m alembic upgrade head

          echo "--- database revision ---"
          current="$(python -m alembic current 2>&1)"
          echo "$current"
          echo "$current" | grep -q "${expected} (head)" \
            || { echo "::error::database is not at ${expected}: ${current}"; exit 1; }

      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest

  frontend-quality-gates:
    name: Frontend quality gates
    runs-on: ubuntu-latest

    # Deliberately no `env:` and no `services:`. The frontend suite runs in jsdom and stubs
    # HTTP at the `fetch` boundary, so it has no reason to reach a database, a backend
    # process or a dev server -- and this job is not given the means to. TEST_DATABASE_URL
    # and DATABASE_URL are set only on the two steps of the other job that need them, so
    # nothing here can read one even by mistake.
    defaults:
      run:
        # Every script below lives in frontend/package.json, and the source-scan tests
        # (`*.node.test.ts`) resolve their paths from `process.cwd()`, which vitest sets to
        # the package root. Run from anywhere else they would scan an empty tree and pass
        # for the wrong reason.
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # The line this project is developed on (24.21.0 locally), pinned the same way and
          # for the same reason Python is pinned to 3.14: CI runs what the developer runs,
          # so a version-specific failure cannot hide behind a different runtime.
          node-version: '24'
          # package.json declares no `packageManager` field, so setup-node's automatic npm
          # caching does not switch itself on; asking for it explicitly is what does. The
          # path is relative to the workspace root, NOT to `working-directory` above.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Install dependencies
        # `npm ci`, not `npm install`: it installs exactly what package-lock.json records and
        # fails outright if package.json and the lockfile disagree, which is the property
        # that makes a CI install reproducible. It also removes node_modules first, so a
        # warm cache cannot satisfy a dependency the lockfile does not name.
        run: npm ci

      - name: Frontend - Tests
        # `vitest run` -- the `run` is vitest's own non-watch mode, not a filter. No path, no
        # `-t`, no `--changed`: every file matched by vitest.config.ts's `include`.
        run: npm test

      - name: Frontend - Typecheck
        # Both TypeScript projects: tsconfig.json (the app, with `types: []`) and
        # tsconfig.node.json (the vite/vitest configs and the `.node.test.ts` scanners).
        # The second is not a subset of the first -- tsconfig.json excludes those files --
        # so checking only one would leave real code unchecked.
        run: npm run typecheck

      - name: Frontend - Production build
        # The shipped command, unmodified. It re-runs the typecheck, which is the previous
        # step over again; that is accepted rather than engineered around, because the
        # alternative is a CI-only `vite build` that is not the command anyone runs locally.
        # The separate step above earns its place by naming the failure: a type error is
        # reported by a step called Typecheck, not by one called Production build.
        run: npm run build

  # ---------------------------------------------------------------------------------------
  # The deployment topology, actually executed.
  #
  # The two jobs above check source. This one checks the thing the source is deployed as, and
  # it exists because the development machine has no container runtime: docker-compose.yml,
  # backend/Dockerfile, frontend/Dockerfile and frontend/nginx.conf had never been built or
  # run anywhere before this job. GitHub's ubuntu runners ship Docker and Compose, so this is
  # the only place the deployment is more than a static claim.
  #
  # It proves the startup chain end to end --
  #
  #     db healthy -> migrate exits 0 -> api healthy -> frontend healthy
  #
  # -- and then the properties that chain is supposed to deliver: PostgreSQL 18.6, Alembic at
  # 0009, the SPA fallback, the /api proxy, secret isolation, an unpublished database, and the
  # gate that stops the API serving against an unmigrated schema.
  #
  # Every assertion below exits non-zero on failure. There is no continue-on-error, no
  # `|| true`, no swallowed status and no condition that lets the job skip itself: it runs on
  # exactly the same pushes and pull requests as the other two.
  #
  # Parallel to them, not downstream, for the reason the header of this file already gives --
  # one red run should name every gate that is red, rather than hiding one behind another.
  docker-runtime:
    name: Docker runtime verification
    runs-on: ubuntu-latest
    # Bounded at the job level as well as per wait. A container that never turns healthy has
    # to fail the run, not hold a runner for six hours.
    timeout-minutes: 30

    env:
      # Unique per run. Two concurrent runs cannot collide, and nothing here can name a
      # developer's local project or reach a volume that holds real data.
      COMPOSE_PROJECT: hotel-intelligence-ci-${{ github.run_id }}
      FAILGATE_PROJECT: hotel-intelligence-ci-${{ github.run_id }}-failgate
      # The restore target is a plain `docker run` container rather than a Compose service, so
      # it carries the run id in its own name for the same reason the projects do: nothing here
      # may collide with a concurrent run or with anything on a developer's machine.
      RESTORE_CONTAINER: hotel-intelligence-ci-${{ github.run_id }}-restore
      RESTORE_API: hotel-intelligence-ci-${{ github.run_id }}-restore-api
      # Not secrets. This database is created for this job and destroyed with it, and the
      # name is deliberately NOT hotel_intelligence_test -- that name is shared with a
      # developer's demo database, and nothing in CI should ever be able to match it.
      POSTGRES_USER: hotel_ci
      POSTGRES_DB: hotel_intelligence_ci
      # High ports, clear of anything the runner image binds by default.
      API_PORT: '18000'
      FRONTEND_PORT: '18080'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Docker and Compose versions
        run: |
          set -euo pipefail
          docker --version
          docker compose version

      - name: Prepare the disposable environment
        run: |
          set -euo pipefail

          # Outside the workspace on purpose: nothing this job writes may land in the git
          # working tree, and $RUNNER_TEMP is destroyed with the runner.
          ENV_FILE="$RUNNER_TEMP/compose.ci.env"
          umask 077

          # Generated per run, never reused, and masked before anything can carry them into a
          # log -- a command trace, an error message, or a resolved `docker compose config`.
          PG_PASSWORD="$(openssl rand -hex 24)"
          APP_SECRET="$(openssl rand -base64 48 | tr -d '\n=')"
          echo "::add-mask::$PG_PASSWORD"
          echo "::add-mask::$APP_SECRET"

          {
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$PG_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "SECRET_KEY=$APP_SECRET"
            # Filled in once the Compose network exists and its subnet can be read back --
            # see the database step. Empty is a valid value (it means "believe no forwarding
            # header"), which is what lets `config` resolve before the network is created.
            echo "TRUSTED_PROXIES="
            # production on purpose. It is the mode that makes SECRET_KEY mandatory, so this
            # job exercises the fail-closed path rather than the permissive one.
            echo "ENVIRONMENT=production"
            echo "LOG_LEVEL=WARNING"
            echo "CORS_ORIGINS="
            echo "API_PORT=$API_PORT"
            echo "FRONTEND_PORT=$FRONTEND_PORT"
          } > "$ENV_FILE"

          {
            echo "ENV_FILE=$ENV_FILE"
            echo "PG_PASSWORD=$PG_PASSWORD"
            echo "APP_SECRET=$APP_SECRET"
          } >> "$GITHUB_ENV"

          echo "wrote $(wc -l < "$ENV_FILE") variables; no value printed"

      - name: Install the job's shell helpers
        run: |
          set -euo pipefail

          # `dc` is the compose invocation with this job's project and env file already bound,
          # so no step can accidentally address a different project.
          cat > "$RUNNER_TEMP/dc" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" "$@"
          SH

          # Readiness comes from Docker's own healthcheck, polled until a deadline. The sleep
          # is the poll interval, NOT the readiness mechanism: the loop exits early the moment
          # the container reports healthy, and fails loudly with status and logs if it never
          # does. A service without a healthcheck is a failure too -- silently treating "no
          # healthcheck" as ready is exactly the hole this job exists to close.
          cat > "$RUNNER_TEMP/wait_healthy" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          service="$1"
          limit="$2"
          deadline=$(( SECONDS + limit ))
          while (( SECONDS < deadline )); do
            cid="$(docker ps -aq \
              --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" \
              --filter "label=com.docker.compose.service=$service" | head -n1)"
            if [[ -n "$cid" ]]; then
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
              if [[ "$status" == healthy ]]; then
                echo "$service: healthy after $(( SECONDS - (deadline - limit) ))s"
                exit 0
              fi
              if [[ "$status" == none ]]; then
                echo "::error::$service has no healthcheck; this job requires one"
                exit 1
              fi
            fi
            sleep 2
          done
          echo "::error::$service did not become healthy within ${limit}s"
          dc ps -a
          dc logs --tail 150 "$service"
          exit 1
          SH

          chmod +x "$RUNNER_TEMP/dc" "$RUNNER_TEMP/wait_healthy"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Resolve and assert the Compose configuration
        run: |
          set -euo pipefail

          # Written to a file rather than stdout: the resolved configuration contains
          # DATABASE_URL, which embeds the password. The assertions below read the file; only
          # their verdicts reach the log.
          dc config --format json > "$RUNNER_TEMP/resolved.json"
          echo "docker compose config: OK"

          python3 - "$RUNNER_TEMP/resolved.json" <<'PY'
          import json, sys

          doc = json.load(open(sys.argv[1]))
          svc = doc["services"]
          checks = []

          def check(label, condition):
              print(("  OK   " if condition else "FAIL   ") + label)
              checks.append(bool(condition))

          check("services are exactly db, migrate, api, frontend",
                set(svc) == {"db", "migrate", "api", "frontend"})
          check("db image is postgres:18.6-alpine", svc["db"]["image"] == "postgres:18.6-alpine")
          check("db publishes no host port", not svc["db"].get("ports"))
          check("db has a healthcheck", "healthcheck" in svc["db"])

          migrate = svc["migrate"]
          check("migrate runs alembic upgrade head",
                migrate.get("command") == ["python", "-m", "alembic", "upgrade", "head"])
          check("migrate restart policy is no", migrate.get("restart") == "no")
          check("migrate waits for db health",
                migrate["depends_on"]["db"]["condition"] == "service_healthy")

          api = svc["api"]
          check("api waits for migrate to complete successfully",
                api["depends_on"]["migrate"]["condition"] == "service_completed_successfully")
          check("api has a healthcheck", "healthcheck" in api)

          fe = svc["frontend"]
          check("frontend waits for api health",
                fe["depends_on"]["api"]["condition"] == "service_healthy")
          check("frontend has a healthcheck", "healthcheck" in fe)

          # Secret reach, asserted on the resolved configuration rather than assumed from the
          # source file -- this is the form the daemon is actually given.
          for name in ("api", "migrate"):
              env = svc[name].get("environment") or {}
              check(f"{name} receives SECRET_KEY", bool(env.get("SECRET_KEY")))
              check(f"{name} receives TRUSTED_PROXIES", "TRUSTED_PROXIES" in env)

          fe_env = fe.get("environment") or {}
          check("frontend receives no SECRET_KEY", "SECRET_KEY" not in fe_env)
          check("frontend receives no POSTGRES_PASSWORD", "POSTGRES_PASSWORD" not in fe_env)
          check("frontend receives no DATABASE_URL", "DATABASE_URL" not in fe_env)

          failed = checks.count(False)
          print(f"\n{checks.count(True)}/{len(checks)} configuration assertions passed")
          if failed:
              print(f"::error::{failed} configuration assertion(s) failed")
              sys.exit(1)
          PY

      - name: Build the images
        run: |
          set -euo pipefail
          dc build
          echo "--- images this project resolves to ---"
          dc images

      - name: Verify the backend image contents
        run: |
          set -euo pipefail

          # --no-deps: this inspects the image, and must not start a database to do it.
          # Runs as the image's USER, so a readability failure here is a real permission bug.
          # Each `test` is its own statement, terminated by `;` rather than chained with `&&`.
          # That is deliberate: under `set -e` a failing command on the left of `&&` is exempt
          # from aborting the script, so `test -f X && echo OK` would silently print nothing
          # and carry on. Sequenced like this, a missing file exits non-zero on the spot.
          dc run --rm --no-deps --entrypoint sh api -c '
            set -eu
            echo "runtime user : $(id -un) (uid $(id -u))"
            test -d /app/app;                 echo "  OK   /app/app"
            test -f /app/app/main.py;         echo "  OK   /app/app/main.py"
            test -f /app/alembic.ini;         echo "  OK   /app/alembic.ini"
            test -r /app/alembic.ini;         echo "  OK   /app/alembic.ini is readable"
            test -d /app/database/migrations; echo "  OK   /app/database/migrations"

            revisions=$(ls /app/database/migrations/versions/*.py | wc -l)
            echo "  revisions present: $revisions"
            if [ "$revisions" -ne 9 ]; then
              echo "::error::expected 9 revisions, found $revisions"
              exit 1
            fi

            for f in /app/database/migrations/versions/*.py; do
              if [ ! -r "$f" ]; then
                echo "::error::$f is not readable by $(id -un)"
                exit 1
              fi
            done
            echo "  OK   every revision readable by the runtime user"

            python -m alembic --help > /dev/null; echo "  OK   python -m alembic is executable"

            if [ "$(id -un)" != "appuser" ]; then
              echo "::error::runtime user is $(id -un), expected appuser"
              exit 1
            fi
            echo "  OK   runtime user is appuser"
          '

      - name: Start PostgreSQL and verify it
        run: |
          set -euo pipefail
          dc up -d db
          wait_healthy db 120

          echo "--- server version, read from inside the container ---"
          version="$(dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc 'SELECT version()')"
          echo "$version"
          case "$version" in
            "PostgreSQL 18.6"*) echo "  OK   PostgreSQL 18.6" ;;
            *) echo "::error::expected PostgreSQL 18.6, got: $version"; exit 1 ;;
          esac

          echo "--- host publication ---"
          # Compose does NOT signal "unpublished" through its exit status: for a port with no
          # host binding it succeeds and prints a zero mapping -- `:0`, and depending on the
          # address family `0.0.0.0:0` or `[::]:0`. Run 34990193958 failed here on exactly
          # that, reading `:0` as evidence of a binding. The OUTPUT has to be read, and what
          # distinguishes the two cases is the host port itself: zero means nothing is
          # published, anything else is a real binding.
          #
          # awk rather than grep so the check cannot turn "no match" into a step failure, and
          # so a multi-line answer (one mapping per address family) is handled a line at a
          # time. `-F:` makes $NF the host port for every shape these mappings take --
          # `127.0.0.1:5432`, `:::5432`, `[::]:5432` -- and the gsub drops any stray CR.
          #
          # No 2>/dev/null and no `if`: a genuine `compose port` failure must abort this step
          # under `set -e`, not be mistaken for an absent binding.
          published="$(dc port db 5432)"
          echo "  compose reports: ${published:-<empty>}"
          real_binding="$(printf '%s\n' "$published" | awk -F: '{ p = $NF; gsub(/[^0-9]/, "", p); if (p != "" && p + 0 != 0) print $0 }')"
          if [ -n "$real_binding" ]; then
            echo "::error::db publishes a host port: $real_binding"
            exit 1
          fi
          echo "  OK   db publishes no host port"

          cid="$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=db")"
          mapped="$(docker inspect -f '{{json .NetworkSettings.Ports}}' "$cid")"
          echo "  db port bindings: $mapped"
          case "$mapped" in
            *HostPort*) echo "::error::db has a host binding: $mapped"; exit 1 ;;
            *) echo "  OK   no host binding on the container either" ;;
          esac

      - name: Set TRUSTED_PROXIES from the real Compose network
        run: |
          set -euo pipefail

          # Read back rather than guessed. Compose allocates this subnet at runtime, which is
          # exactly why docker-compose.yml hard-codes nothing: the value that makes the
          # backend believe nginx's X-Forwarded-For is a property of the running network.
          cid="$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=db")"
          network="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$cid")"
          subnet="$(docker network inspect "$network" -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}')"
          echo "network: $network"
          echo "subnet : $subnet"

          # Refuse anything that would trust the whole internet, and anything that is not a
          # subnet at all. The application would reject a malformed value at startup; catching
          # it here names the problem instead of leaving it as a container that will not boot.
          case "$subnet" in
            ""|"0.0.0.0/0"|"::/0")
              echo "::error::refusing to use '$subnet' as TRUSTED_PROXIES"
              exit 1 ;;
          esac
          python3 -c "import ipaddress,sys; ipaddress.ip_network(sys.argv[1]); print('  OK   parses as a network')" "$subnet"

          # migrate, api and frontend have not started yet, so every service that receives this
          # value will be created with it.
          sed -i "s|^TRUSTED_PROXIES=.*|TRUSTED_PROXIES=$subnet|" "$ENV_FILE"
          grep -q "^TRUSTED_PROXIES=$subnet$" "$ENV_FILE"
          echo "  OK   TRUSTED_PROXIES set to the live Compose subnet"

      - name: Run the migration
        run: |
          set -euo pipefail

          # Started detached, then waited on by container id.
          #
          # NOT `up --exit-code-from migrate`: that flag implies --abort-on-container-exit,
          # which stops every container in the invocation as soon as one exits -- it would
          # take the running database down with it the moment the migration finished. `docker
          # wait` returns the exit code of this container alone and touches nothing else.
          dc up -d migrate

          cid="$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=migrate" | head -n1)"
          if [ -z "$cid" ]; then
            echo "::error::no migrate container was created"
            dc ps -a
            exit 1
          fi

          # Bounded: a migration that hangs must fail the job, not sit here until the runner
          # is reclaimed. `timeout` exits 124 if it fires, which is a non-zero code like any
          # other and fails the step.
          code="$(timeout 600 docker wait "$cid")"
          echo "  migrate exit code: $code"

          echo "--- migration log ---"
          dc logs migrate

          if [ "$code" != "0" ]; then
            echo "::error::migrate exited $code"
            exit 1
          fi
          echo "  OK   migrate exited 0"

          echo "--- container state ---"
          dc ps -a --format 'table {{.Service}}\t{{.State}}\t{{.ExitCode}}'

          echo "--- alembic_version, read from PostgreSQL ---"
          revision="$(dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc 'SELECT version_num FROM alembic_version')"
          echo "  $revision"
          [ "$revision" = "0009_audit_booking_deleted" ] || {
            echo "::error::expected 0009_audit_booking_deleted, got $revision"; exit 1; }
          echo "  OK   schema is at 0009_audit_booking_deleted"

          tables="$(dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          echo "  public tables created: $tables"
          [ "$tables" -gt 15 ] || { echo "::error::only $tables tables; the schema did not apply"; exit 1; }

      - name: Start the API and verify it
        run: |
          set -euo pipefail
          dc up -d api
          wait_healthy api 180

          echo "--- /health, from inside the container (the real healthcheck path) ---"
          dc exec -T api python -c "
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5) as r:
              body = json.load(r)
              assert r.status == 200, r.status
          print('  status      :', body['status'])
          print('  environment :', body['environment'])
          assert body['status'] == 'ok', body
          assert body['environment'] == 'production', body
          print('  OK   /health returns 200 and reports production')
          "

          echo "--- /health/db: proves api -> db over the Compose network ---"
          dc exec -T api python -c "
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5) as r:
              body = json.load(r)
              assert r.status == 200, r.status
          print('  status   :', body['status'])
          print('  database :', body['database'])
          assert body['status'] == 'ok', body
          assert body['database'] == 'reachable', body
          print('  OK   /health/db returns 200 and the database is reachable')
          "

      - name: Start the frontend and verify the full topology
        run: |
          set -euo pipefail
          dc up -d frontend
          wait_healthy frontend 120

          echo "--- the chain, end to end ---"
          dc ps -a --format 'table {{.Service}}\t{{.State}}\t{{.Status}}\t{{.ExitCode}}'

          for spec in "db:running" "api:running" "frontend:running"; do
            service="${spec%%:*}"
            cid="$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=$service" | head -n1)"
            state="$(docker inspect -f '{{.State.Status}}' "$cid")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
            echo "  $service: state=$state health=$health"
            [ "$state" = "running" ] || { echo "::error::$service is $state"; exit 1; }
            [ "$health" = "healthy" ] || { echo "::error::$service health is $health"; exit 1; }
          done

          cid="$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=migrate" | head -n1)"
          state="$(docker inspect -f '{{.State.Status}}' "$cid")"
          code="$(docker inspect -f '{{.State.ExitCode}}' "$cid")"
          echo "  migrate: state=$state exit=$code"
          [ "$state" = "exited" ] && [ "$code" = "0" ] || {
            echo "::error::migrate is $state with exit $code"; exit 1; }
          echo "  OK   db healthy -> migrate exited 0 -> api healthy -> frontend healthy"

      - name: Verify the SPA through nginx
        run: |
          set -euo pipefail
          base="http://127.0.0.1:${FRONTEND_PORT}"

          # `/index.html` first: it is matched by nginx's exact location, which has no
          # fallback, so a 200 here means the built artefact really is being served rather
          # than something being invented by try_files.
          for path in / /index.html /bookings /reviews /intelligence; do
            body="$RUNNER_TEMP/spa-body"
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 "$base$path")"
            printf '  %-16s -> HTTP %s' "$path" "$code"
            [ "$code" = "200" ] || { echo; echo "::error::$path returned $code"; exit 1; }
            grep -q '<div id="root"></div>' "$body" || {
              echo; echo "::error::$path did not return the SPA document"; exit 1; }
            grep -q '<title>AI Hotel Intelligence Platform</title>' "$body" || {
              echo; echo "::error::$path returned HTML that is not this application"; exit 1; }
            echo "   SPA document"
          done
          echo "  OK   SPA fallback serves real client-side routes rather than 404"

          echo "--- cache policy, which only a running nginx can demonstrate ---"
          curl -sSI --max-time 15 "$base/index.html" | grep -i '^cache-control:' || {
            echo "::error::index.html carries no Cache-Control"; exit 1; }

      - name: Verify the /api proxy through nginx
        run: |
          set -euo pipefail

          # Deliberately through the FRONTEND port, never the API's own. The path under test is
          # runner -> nginx -> /api/ -> api:8000 -> FastAPI, and a direct call to the API port
          # would prove nothing about the proxy.
          #
          # /api/v1/ is the v1 router's own metadata endpoint (app/api/v1/endpoints/meta.py):
          # unauthenticated, touches no table, exposes no business data. It is used because it
          # already exists -- there is no /api/v1/health, and none was invented.
          base="http://127.0.0.1:${FRONTEND_PORT}"
          body="$RUNNER_TEMP/api-body"

          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 "$base/api/v1/")"
          echo "  GET /api/v1/ -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::proxy returned $code"; cat "$body"; exit 1; }

          echo "--- response body ---"
          cat "$body"; echo

          python3 - "$body" <<'PY'
          import json, sys
          body = json.load(open(sys.argv[1]))
          assert body["api_version"] == "v1", body
          print("  OK   JSON from FastAPI, api_version=v1 -- not the SPA fallback")
          PY

          echo "--- the request really left nginx: an unknown API path must 404 as the API, not as the SPA ---"
          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 "$base/api/v1/__no_such_route__")"
          echo "  GET /api/v1/__no_such_route__ -> HTTP $code"
          if [ "$code" != "404" ]; then
            echo "::error::expected 404 from the API, got $code"
            exit 1
          fi
          if grep -q '<div id="root">' "$body"; then
            echo "::error::an /api path fell through to the SPA fallback"
            exit 1
          fi
          echo "  OK   /api/ is proxied, not swallowed by try_files"

      - name: Verify secrets do not reach the frontend
        run: |
          set -euo pipefail

          cid="$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=frontend" | head -n1)"

          # Names only. The values are never printed, and both are masked in any case.
          echo "--- frontend container environment (variable names only) ---"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid" | cut -d= -f1 | sort | sed 's/^/  /'

          for name in SECRET_KEY POSTGRES_PASSWORD DATABASE_URL; do
            if docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid" | cut -d= -f1 | grep -qx "$name"; then
              echo "::error::$name is present in the frontend container environment"
              exit 1
            fi
            echo "  $name: ABSENT"
          done

          # The shipped bundle, searched for the actual generated values. Copied out and
          # searched here, where the secrets already exist, rather than passed into the
          # container. grep -q prints nothing either way.
          echo "--- built assets ---"
          rm -rf "$RUNNER_TEMP/html"
          dc cp frontend:/usr/share/nginx/html "$RUNNER_TEMP/html"
          files="$(find "$RUNNER_TEMP/html" -type f | wc -l)"
          echo "  searched $files served files"

          for label in APP_SECRET PG_PASSWORD; do
            value="${!label}"
            if grep -rqF -- "$value" "$RUNNER_TEMP/html"; then
              echo "::error::a generated secret appears in the served frontend assets"
              exit 1
            fi
            echo "  ${label}: NOT FOUND in served assets"
          done

          # And not in what nginx actually returns, either.
          curl -sS --max-time 15 "http://127.0.0.1:${FRONTEND_PORT}/" > "$RUNNER_TEMP/served-index"
          for label in APP_SECRET PG_PASSWORD; do
            value="${!label}"
            if grep -qF -- "$value" "$RUNNER_TEMP/served-index"; then
              echo "::error::a secret appears in an nginx response"
              exit 1
            fi
          done
          echo "  OK   no secret in the served document"
          rm -rf "$RUNNER_TEMP/html" "$RUNNER_TEMP/served-index"

      - name: Verify the network topology
        run: |
          set -euo pipefail

          echo "--- frontend -> api, by Compose DNS, using the image's own busybox wget ---"
          dc exec -T frontend wget -q -O- http://api:8000/health | head -c 200; echo
          echo "  OK   frontend resolves and reaches api:8000"

          echo "--- api -> db, by Compose DNS ---"
          dc exec -T api python -c "
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5) as r:
              assert json.load(r)['database'] == 'reachable'
          print('  OK   api reaches db:5432')
          "

          echo "--- the database is not reachable from the host ---"
          # Same reading as in the database step: Compose succeeds and prints a zero mapping
          # when nothing is bound, so the host port in the output is what decides.
          published="$(dc port db 5432)"
          echo "  compose reports: ${published:-<empty>}"
          real_binding="$(printf '%s\n' "$published" | awk -F: '{ p = $NF; gsub(/[^0-9]/, "", p); if (p != "" && p + 0 != 0) print $0 }')"
          if [ -n "$real_binding" ]; then
            echo "::error::db is published at $real_binding"
            exit 1
          fi
          echo "  OK   db has no host publication"

          echo "--- api host publication is intentionally retained (Stage 5.29) ---"
          dc port api 8000

      - name: Verify migration idempotency
        run: |
          set -euo pipefail

          before="$(dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc 'SELECT version_num FROM alembic_version')"
          echo "  before: $before"

          # --force-recreate so this is unambiguously a second execution rather than compose
          # deciding the exited container is already up to date and doing nothing.
          dc up -d --force-recreate migrate
          cid="$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=migrate" | head -n1)"
          code="$(timeout 600 docker wait "$cid")"
          echo "  second migrate exit code: $code"

          echo "--- second run log ---"
          dc logs --tail 40 migrate

          if [ "$code" != "0" ]; then
            echo "::error::second migration exited $code"
            exit 1
          fi
          echo "  OK   second migration exited 0"

          after="$(dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc 'SELECT version_num FROM alembic_version')"
          echo "  after : $after"
          [ "$after" = "0009_audit_booking_deleted" ] || {
            echo "::error::revision moved to $after"; exit 1; }
          [ "$before" = "$after" ] || { echo "::error::revision changed"; exit 1; }
          echo "  OK   upgrade head is idempotent and the schema is unchanged"

      - name: Verify persistence across a restart
        run: |
          set -euo pipefail

          volume="${COMPOSE_PROJECT}_postgres_data"
          docker volume inspect "$volume" --format '  volume {{.Name}} ({{.Driver}})'

          rows="$(dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          echo "  tables before restart: $rows"

          dc stop
          dc start db api frontend
          wait_healthy db 120
          wait_healthy api 180
          wait_healthy frontend 120

          revision="$(dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc 'SELECT version_num FROM alembic_version')"
          after="$(dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          echo "  revision after restart: $revision"
          echo "  tables after restart  : $after"
          [ "$revision" = "0009_audit_booking_deleted" ] || {
            echo "::error::schema did not survive the restart"; exit 1; }
          [ "$rows" = "$after" ] || { echo "::error::table count changed across restart"; exit 1; }
          echo "  OK   the named volume preserved the schema across stop/start"

      - name: Seed deterministic data through the API
        run: |
          set -euo pipefail

          # Through the real endpoints, not an INSERT. A migrated database is empty, so there
          # would otherwise be nothing for a backup to prove it preserved -- and rows written
          # straight into the tables would prove only that pg_dump copies rows, not that the
          # application's own data survives a round trip. This is the documented bootstrap
          # path from docs/deployment/first-run-bootstrap.md, exercised end to end.
          base="http://127.0.0.1:${FRONTEND_PORT}"

          code="$(curl -sS -o "$RUNNER_TEMP/register.json" -w '%{http_code}' --max-time 15 \
            -X POST "$base/api/v1/auth/register" -H 'Content-Type: application/json' \
            -d '{"email":"backup-probe@example.test","full_name":"Backup Probe","password":"ci-only-not-a-real-password"}')"
          echo "  POST /api/v1/auth/register -> $code"
          [ "$code" = "201" ] || { echo "::error::register returned $code"; cat "$RUNNER_TEMP/register.json"; exit 1; }

          code="$(curl -sS -o "$RUNNER_TEMP/login.json" -w '%{http_code}' --max-time 15 \
            -X POST "$base/api/v1/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"backup-probe@example.test","password":"ci-only-not-a-real-password"}')"
          echo "  POST /api/v1/auth/login    -> $code"
          [ "$code" = "200" ] || { echo "::error::login returned $code"; exit 1; }

          # The token is a bearer credential: read it into a masked variable rather than
          # echoing it, and never write it to a file that a later step prints.
          token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["access_token"])' "$RUNNER_TEMP/login.json")"
          echo "::add-mask::$token"
          rm -f "$RUNNER_TEMP/login.json"

          code="$(curl -sS -o "$RUNNER_TEMP/hotel.json" -w '%{http_code}' --max-time 15 \
            -X POST "$base/api/v1/hotels" -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Backup Probe Hotel","slug":"backup-probe-hotel","address_line1":"1 Test Street","city":"Testville","country_code":"GR","currency":"EUR"}')"
          echo "  POST /api/v1/hotels        -> $code"
          [ "$code" = "201" ] || { echo "::error::hotel creation returned $code"; cat "$RUNNER_TEMP/hotel.json"; exit 1; }

          echo "--- what the API actually wrote ---"
          dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "SELECT u.email, h.slug, uh.role FROM user_hotels uh
               JOIN users u ON u.id = uh.user_id
               JOIN hotels h ON h.id = uh.hotel_id"
          echo "  OK   one user, one hotel and the creator's owner membership exist"

      - name: Capture source facts and take a pg_dump backup
        run: |
          set -euo pipefail

          # The facts are captured BEFORE the dump and compared against the restored database
          # afterwards. Counts alone would not prove much, so this also pins the exact stored
          # values -- including the server-generated public_id UUIDs and the timestamps, which
          # must come back byte-identical. They are read from the source rather than asserted
          # against literals precisely because they are server-generated.
          cat > "$RUNNER_TEMP/facts.sql" <<'SQL'
          SELECT 'revision=' || version_num FROM alembic_version
          UNION ALL SELECT 'base_tables=' || count(*)::text FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
          UNION ALL SELECT 'views=' || count(*)::text FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'VIEW'
          UNION ALL SELECT 'count.users=' || count(*)::text FROM users
          UNION ALL SELECT 'count.hotels=' || count(*)::text FROM hotels
          UNION ALL SELECT 'count.user_hotels=' || count(*)::text FROM user_hotels
          UNION ALL SELECT 'row.user=' || email || '|' || full_name || '|' || is_active::text
            || '|' || public_id::text || '|'
            || to_char(password_changed_at AT TIME ZONE 'UTC', 'YYYY-MM-DD HH24:MI:SS.US') FROM users
          UNION ALL SELECT 'row.hotel=' || slug || '|' || name || '|' || city || '|'
            || country_code || '|' || currency || '|' || timezone || '|' || public_id::text FROM hotels
          UNION ALL SELECT 'row.membership=' || u.email || '|' || h.slug || '|' || uh.role
            FROM user_hotels uh JOIN users u ON u.id = uh.user_id JOIN hotels h ON h.id = uh.hotel_id
          UNION ALL SELECT 'digest.users=' || md5(string_agg(
            email || full_name || public_id::text || is_active::text, '|' ORDER BY email)) FROM users
          UNION ALL SELECT 'digest.hotels=' || md5(string_agg(
            slug || name || public_id::text, '|' ORDER BY slug)) FROM hotels
          ORDER BY 1
          SQL

          dc cp "$RUNNER_TEMP/facts.sql" "db:/tmp/facts.sql"
          dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -f /tmp/facts.sql \
            > "$RUNNER_TEMP/source-facts.txt"
          echo "--- source facts ---"
          sed 's/^/  /' "$RUNNER_TEMP/source-facts.txt"

          echo "--- the client tools this procedure depends on ---"
          dc exec -T db pg_dump --version
          dc exec -T db pg_restore --version

          # Custom format, not plain SQL: it is compressed, it can be inspected with
          # `pg_restore --list` without being applied, and it can be restored selectively.
          # Written inside the container and copied out, rather than streamed over stdout,
          # because the archive is binary and must not pass through any text handling.
          #
          # No password anywhere: `dc exec db` authenticates over the container's own unix
          # socket, so nothing sensitive reaches the command line, the log or the process list.
          dc exec -T db pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            --format=custom --file=/tmp/hotel.backup
          dc cp "db:/tmp/hotel.backup" "$RUNNER_TEMP/hotel.backup"

          bytes="$(stat -c%s "$RUNNER_TEMP/hotel.backup")"
          echo "  backup size: $bytes bytes"
          [ "$bytes" -gt 1000 ] || { echo "::error::backup is implausibly small ($bytes bytes)"; exit 1; }

          echo "--- pg_restore --list (the archive is readable without restoring it) ---"
          dc exec -T db pg_restore --list /tmp/hotel.backup > "$RUNNER_TEMP/archive-toc.txt"
          echo "  table-of-contents entries: $(grep -c ';' "$RUNNER_TEMP/archive-toc.txt")"

          echo "--- TABLE entries in the archive ---"
          grep -E ' TABLE [a-z_]+ ' "$RUNNER_TEMP/archive-toc.txt" | sed 's/^/  /'

          # A TOC line names the schema before the object: `... TABLE public users hotel_ci`,
          # not `TABLE users`. Matching the schema-qualified form is what makes this assertion
          # real -- the first version searched for `TABLE users` and found nothing.
          for table in users hotels user_hotels alembic_version audit_events; do
            if ! grep -qE " TABLE public ${table}( |$)" "$RUNNER_TEMP/archive-toc.txt"; then
              echo "::error::archive contains no TABLE public.${table}"
              exit 1
            fi
            echo "  OK   archive contains TABLE public.${table}"
          done
          echo "  OK   custom-format backup created and verified readable"

      - name: Restore into a separate disposable PostgreSQL instance
        run: |
          set -euo pipefail

          # A SEPARATE container, not a second database in the source server. Restoring into a
          # fresh instance is what disaster recovery actually means, and it also proves the
          # archive is portable rather than dependent on anything left in the source server.
          #
          # Named after the run id and attached to this project's network; no global name is
          # used, so nothing here can collide with another run or with a developer's Docker.
          network="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' \
            "$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --filter "label=com.docker.compose.service=db" | head -n1)")"
          echo "  attaching to network: $network"

          restore_password="$(openssl rand -hex 24)"
          echo "::add-mask::$restore_password"

          docker run -d --name "$RESTORE_CONTAINER" --network "$network" \
            -e POSTGRES_PASSWORD="$restore_password" \
            -e POSTGRES_DB=hotel_restore \
            postgres:18.6-alpine > /dev/null
          echo "  started $RESTORE_CONTAINER"

          ready=no
          for _ in $(seq 60); do
            if docker exec "$RESTORE_CONTAINER" pg_isready -U postgres -d hotel_restore > /dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 2
          done
          if [ "$ready" != yes ]; then
            echo "::error::the restore target never became ready"
            docker logs --tail 50 "$RESTORE_CONTAINER"
            exit 1
          fi
          echo "  restore target is accepting connections"

          docker exec "$RESTORE_CONTAINER" psql -U postgres -d hotel_restore -tAc \
            "SELECT 'target server: ' || version()"

          docker cp "$RUNNER_TEMP/hotel.backup" "$RESTORE_CONTAINER:/tmp/hotel.backup"

          # --exit-on-error matters more than it looks: without it pg_restore reports errors
          # and still exits 0, so "the restore succeeded" would mean nothing. --no-owner and
          # --no-privileges because the dump's objects belong to a role that does not exist in
          # this fresh instance, which is the normal cross-instance case.
          docker exec "$RESTORE_CONTAINER" pg_restore \
            --exit-on-error --no-owner --no-privileges \
            -U postgres -d hotel_restore /tmp/hotel.backup
          echo "  OK   pg_restore completed with --exit-on-error"

      - name: Prove the restored database matches the source
        run: |
          set -euo pipefail

          docker cp "$RUNNER_TEMP/facts.sql" "$RESTORE_CONTAINER:/tmp/facts.sql"
          docker exec "$RESTORE_CONTAINER" psql -U postgres -d hotel_restore -tA -f /tmp/facts.sql \
            > "$RUNNER_TEMP/restored-facts.txt"

          echo "--- restored facts ---"
          sed 's/^/  /' "$RUNNER_TEMP/restored-facts.txt"

          echo "--- source vs restored ---"
          if ! diff -u "$RUNNER_TEMP/source-facts.txt" "$RUNNER_TEMP/restored-facts.txt"; then
            echo "::error::the restored database does not match the source"
            exit 1
          fi
          echo "  OK   every captured fact is identical, byte for byte"

          # The diff above is the real proof. These restate the few facts that must hold
          # absolutely, so a failure names what was wrong rather than only that something was.
          revision="$(docker exec "$RESTORE_CONTAINER" psql -U postgres -d hotel_restore -tAc 'SELECT version_num FROM alembic_version')"
          [ "$revision" = "0009_audit_booking_deleted" ] || {
            echo "::error::restored revision is $revision"; exit 1; }
          echo "  OK   alembic_version is 0009_audit_booking_deleted -- no upgrade or downgrade happened"

          tables="$(docker exec "$RESTORE_CONTAINER" psql -U postgres -d hotel_restore -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          [ "$tables" -eq 22 ] || { echo "::error::restored database has $tables base tables, expected 22"; exit 1; }
          echo "  OK   22 base tables (21 application tables + alembic_version)"

          membership="$(docker exec "$RESTORE_CONTAINER" psql -U postgres -d hotel_restore -tAc \
            "SELECT u.email || '/' || h.slug || '/' || uh.role FROM user_hotels uh
               JOIN users u ON u.id = uh.user_id JOIN hotels h ON h.id = uh.hotel_id")"
          echo "  restored membership: $membership"
          [ "$membership" = "backup-probe@example.test/backup-probe-hotel/owner" ] || {
            echo "::error::the application row did not survive the round trip"; exit 1; }
          echo "  OK   the user, the hotel and the owner membership all survived"

          echo "--- the source database was only ever read ---"
          dc exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -f /tmp/facts.sql \
            > "$RUNNER_TEMP/source-facts-after.txt"
          if ! diff -u "$RUNNER_TEMP/source-facts.txt" "$RUNNER_TEMP/source-facts-after.txt"; then
            echo "::error::the source database changed during backup and restore"
            exit 1
          fi
          echo "  OK   source is unchanged -- nothing was restored over it"

      - name: Prove the application can serve from the restored database
        run: |
          set -euo pipefail

          # Rows in the right places is not the same as a database the application can use.
          #
          # This starts the real API image, with its real CMD, against the restored database and
          # asks its own readiness probe -- which runs a query rather than reporting process
          # liveness. NOT via starlette's TestClient: that needs httpx, a dev dependency the
          # runtime image deliberately does not carry, and an in-process harness would prove
          # less than uvicorn actually serving. urllib is in the standard library, and is the
          # same mechanism the compose healthcheck already uses.
          #
          # ENVIRONMENT=production so this also exercises the strict configuration path, which
          # refuses to start without a signing secret.
          network="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$RESTORE_CONTAINER")"
          restore_url="$(docker exec "$RESTORE_CONTAINER" printenv POSTGRES_PASSWORD | \
            sed "s|^|postgresql+psycopg://postgres:|; s|$|@${RESTORE_CONTAINER}:5432/hotel_restore|")"
          echo "::add-mask::$restore_url"

          docker run -d --name "$RESTORE_API" --network "$network" \
            -e DATABASE_URL="$restore_url" \
            -e ENVIRONMENT=production \
            -e SECRET_KEY="$APP_SECRET" \
            -e LOG_LEVEL=WARNING \
            hotel-intelligence-api:local > /dev/null

          alive=no
          for _ in $(seq 45); do
            if docker exec "$RESTORE_API" python -c "
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
          " > /dev/null 2>&1; then
              alive=yes
              break
            fi
            sleep 2
          done
          if [ "$alive" != yes ]; then
            echo "::error::the API never came up against the restored database"
            docker logs --tail 60 "$RESTORE_API"
            exit 1
          fi
          echo "  the API started against the restored database"

          docker exec "$RESTORE_API" python -c "
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5) as response:
              body = json.load(response)
              status = response.status
          print('  /health/db ->', status, json.dumps(body))
          assert status == 200, status
          assert body['status'] == 'ok', body
          assert body['database'] == 'reachable', body
          print('  OK   the application reached the restored database')
          "

          docker rm -f "$RESTORE_API" > /dev/null
          echo "  disposable API container removed"

      - name: Prove a damaged backup is refused
        run: |
          set -euo pipefail

          # A COPY of the archive, truncated. The real backup is never touched, and the target
          # is a third database so neither the source nor the verified restore is at risk.
          head -c 4096 "$RUNNER_TEMP/hotel.backup" > "$RUNNER_TEMP/damaged.backup"
          echo "  damaged copy: $(stat -c%s "$RUNNER_TEMP/damaged.backup") bytes of $(stat -c%s "$RUNNER_TEMP/hotel.backup")"

          docker exec "$RESTORE_CONTAINER" createdb -U postgres hotel_damaged
          docker cp "$RUNNER_TEMP/damaged.backup" "$RESTORE_CONTAINER:/tmp/damaged.backup"

          # The one place a non-zero exit is the required outcome, so it is captured
          # deliberately and asserted on rather than allowed to fail the step.
          set +e
          docker exec "$RESTORE_CONTAINER" pg_restore --exit-on-error --no-owner --no-privileges \
            -U postgres -d hotel_damaged /tmp/damaged.backup
          damaged_code=$?
          set -e
          echo "  pg_restore on the damaged archive exited: $damaged_code"
          if [ "$damaged_code" -eq 0 ]; then
            echo "::error::a truncated archive restored successfully; the restore gate proves nothing"
            exit 1
          fi
          echo "  OK   a damaged archive is refused rather than silently half-applied"

          intact="$(docker exec "$RESTORE_CONTAINER" psql -U postgres -d hotel_restore -tAc 'SELECT count(*) FROM users')"
          [ "$intact" = "1" ] || { echo "::error::the good restore was affected"; exit 1; }
          echo "  OK   the verified restore and the source are both untouched"

          rm -f "$RUNNER_TEMP/damaged.backup"

      - name: Verify the migration gate blocks the API
        run: |
          set -euo pipefail

          # A SEPARATE disposable project, so the proven-good stack above is untouched and its
          # already-migrated volume cannot make this test pass for the wrong reason.
          #
          # The failure is injected by configuration only: an override that points migrate at a
          # database that does not exist. No committed file is modified, no migration is edited
          # and nothing is downgraded.
          #
          # The container names are overridden too, and that is not cosmetic. docker-compose.yml
          # sets `container_name: hotel_db` and friends, and container_name is global to the
          # DAEMON -- Compose does not scope it by project. So a second project isolates the
          # network and the volume but still tries to claim `/hotel_db`, and run 35097766182
          # failed here with "Conflict. The container name /hotel_db is already in use" while
          # the proven-good stack was still up for the persistence check. Distinct names make
          # the two stacks genuinely independent.
          override="$RUNNER_TEMP/failgate.yml"
          cat > "$override" <<'YML'
          services:
            db:
              container_name: hotel_db_failgate
            migrate:
              container_name: hotel_migrate_failgate
              environment:
                DATABASE_URL: postgresql+psycopg://nobody:wrong@db:5432/database_that_does_not_exist
            api:
              container_name: hotel_api_failgate
            frontend:
              container_name: hotel_frontend_failgate
          YML

          fdc() {
            docker compose --env-file "$ENV_FILE" -p "$FAILGATE_PROJECT" \
              -f docker-compose.yml -f "$override" "$@"
          }

          fdc up -d db
          fail_db_ready=no
          for _ in $(seq 60); do
            cid="$(docker ps -aq --filter "label=com.docker.compose.project=$FAILGATE_PROJECT" --filter "label=com.docker.compose.service=db" | head -n1)"
            if [ -n "$cid" ]; then
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
              if [ "$status" = healthy ]; then
                fail_db_ready=yes
                break
              fi
            fi
            sleep 2
          done
          if [ "$fail_db_ready" != yes ]; then
            echo "::error::the failgate database never became healthy, so the gate cannot be tested"
            fdc ps -a
            exit 1
          fi
          echo "  failgate db is healthy"

          echo "--- migrate must fail ---"
          # This is the one place in the job where a NON-zero exit is the required outcome, so
          # it is captured deliberately and asserted on. `set +e` is scoped to the single
          # command and restored immediately; a zero exit here fails the step.
          fdc up -d migrate
          mcid="$(docker ps -aq --filter "label=com.docker.compose.project=$FAILGATE_PROJECT" --filter "label=com.docker.compose.service=migrate" | head -n1)"
          migrate_code="$(timeout 300 docker wait "$mcid")"
          echo "  migrate exit code: $migrate_code"
          echo "--- failgate migration log ---"
          fdc logs --tail 30 migrate
          if [ "$migrate_code" = "0" ]; then
            echo "::error::migrate succeeded against a nonexistent database; the gate is not real"
            exit 1
          fi
          echo "  OK   migrate failed as intended"

          echo "--- the API must refuse to start ---"
          set +e
          fdc up -d api
          api_code=$?
          set -e
          echo "  'up -d api' exit code: $api_code"
          if [ "$api_code" -eq 0 ]; then
            echo "::error::the API started despite a failed migration"
            exit 1
          fi

          running="$(docker ps -q --filter "label=com.docker.compose.project=$FAILGATE_PROJECT" --filter "label=com.docker.compose.service=api" | wc -l)"
          echo "  running api containers: $running"
          if [ "$running" -ne 0 ]; then
            echo "::error::an api container is running"
            exit 1
          fi
          echo "  OK   api did not start"

          echo "--- the frontend must not become healthy ---"
          set +e
          fdc up -d frontend
          fe_code=$?
          set -e
          echo "  'up -d frontend' exit code: $fe_code"
          if [ "$fe_code" -eq 0 ]; then
            echo "::error::the frontend started despite a failed migration"
            exit 1
          fi

          healthy="$(docker ps -q --filter "label=com.docker.compose.project=$FAILGATE_PROJECT" --filter "label=com.docker.compose.service=frontend" --filter "health=healthy" | wc -l)"
          echo "  healthy frontend containers: $healthy"
          if [ "$healthy" -ne 0 ]; then
            echo "::error::the frontend is healthy"
            exit 1
          fi
          echo "  OK   frontend did not become healthy"

          echo "  OK   the API cannot bypass a failed migration"

          fdc down -v --remove-orphans
          rm -f "$override"
          echo "  failgate project and its override removed"

      - name: Tear down the disposable environment
        # always(), so a failed assertion above still leaves the runner clean -- and it does
        # NOT mask that failure: the job's conclusion is already decided by the failed step.
        if: always()
        run: |
          # `set +e` explicitly, because omitting `set -e` is NOT enough: GitHub invokes every
          # run block as `shell: /usr/bin/bash -e {0}`, so -e is already on before the first
          # line here. Run 34984757640 proved it -- teardown removed the container, the volume
          # and the network exactly as intended, then the step still went red because its last
          # command, `docker volume ls | grep '^<project>_'`, exits 1 when no volume survives,
          # which is the SUCCESS case. -e killed the script on that.
          #
          # Best-effort is the whole point of this step: it must attempt every cleanup command
          # even when an earlier one cannot run -- there may be no containers to log if the
          # build itself failed. This hides nothing. `if: always()` runs the step in addition
          # to a failure, never instead of it, and the job's conclusion is already decided by
          # the step that failed. No assertion lives here, so none is being suppressed, and
          # there is still no `continue-on-error` and no `|| true` anywhere in this workflow.
          set +e
          set -u

          echo "--- final state before teardown ---"
          docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" ps -a
          echo "--- api logs (tail) ---"
          docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" logs --tail 60 api
          echo "--- frontend logs (tail) ---"
          docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" logs --tail 60 frontend

          # -v is safe here and ONLY here: both project names contain this run id, so the
          # volumes they name can only be the ones this job created. Nothing unrelated is
          # named and no prune is run, so no other Docker resource on the runner is touched.
          docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" down -v --remove-orphans
          docker compose --env-file "$ENV_FILE" -p "$FAILGATE_PROJECT" -f docker-compose.yml down -v --remove-orphans

          # The restore target is not a Compose service, so `down` does not reach it. Removed
          # by its exact run-scoped name -- never by prune, never by a filter that could match
          # anything else on the host.
          docker rm -f "$RESTORE_CONTAINER" "$RESTORE_API"

          # The backup and every file derived from it. These live in $RUNNER_TEMP, outside the
          # workspace, so no archive can ever be staged, committed or uploaded as an artifact.
          rm -f "$ENV_FILE" "$RUNNER_TEMP/failgate.yml" "$RUNNER_TEMP/resolved.json"
          rm -f "$RUNNER_TEMP/hotel.backup" "$RUNNER_TEMP/damaged.backup" "$RUNNER_TEMP/facts.sql"
          rm -f "$RUNNER_TEMP/source-facts.txt" "$RUNNER_TEMP/source-facts-after.txt"
          rm -f "$RUNNER_TEMP/restored-facts.txt" "$RUNNER_TEMP/archive-toc.txt"
          rm -f "$RUNNER_TEMP/register.json" "$RUNNER_TEMP/login.json" "$RUNNER_TEMP/hotel.json"
          rm -rf "$RUNNER_TEMP/html"

          echo "--- containers left from this run (expected: none) ---"
          docker ps -a --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" --format '{{.Names}}'
          docker ps -a --filter "label=com.docker.compose.project=$FAILGATE_PROJECT" --format '{{.Names}}'
          docker ps -a --filter "name=$RESTORE_CONTAINER" --format '{{.Names}}'
          docker ps -a --filter "name=$RESTORE_API" --format '{{.Names}}'
          echo "--- volumes left from this run (expected: none) ---"
          docker volume ls --format '{{.Name}}' | grep -E "^(${COMPOSE_PROJECT}|${FAILGATE_PROJECT})_"
          echo "(a grep with no output above means no volume survived, which is the expectation)"
